{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotyList</title>
    <link rel="stylesheet" href="{% static 'spotylist/css/style.css' %}">
</head>
<body>

    <header class="header">
        <p class="logo"><span>Spoty</span>List</p>
    </header>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message message--{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="main">

        <section class="albums-panel">
            <h2 class="panel-title">Список всех альбомов</h2>
            
            <div style="margin-bottom: 15px;">
                <a href="?source=file" class="btn btn--primary" style="text-decoration: none; display: inline-block; text-align:center;">Показать из JSON</a>
                <a href="?source=db" class="btn btn--primary" style="text-decoration: none; display: inline-block; text-align: center;">Показать из БД</a>
            </div>

            <input type="text" id="search-input" class="input" placeholder="Поиск по альбомам" style="margin-bottom: 15px;">

            <div class="albums-grid">
                {% include 'spotylist/_album_cards.html' %}
            </div>
        </section>

        <section class="create-panel">

            <div class="panel-actions">
                <button type="button" id="save-btn" class="btn btn--primary">Сохранить</button>
                <button type="button" id="import-btn" class="btn btn--primary">Импорт</button>
                <input type="file" id="import-input" accept=".json,application/json" hidden>
            </div>

            <form id="album-form" class="album-form" autocomplete="off">
                {% csrf_token %}

                <div class="form-row" style="margin-bottom: 10px;">
                    <label style="margin-right: 15px;">
                        <input type="radio" name="save_destination" value="file" checked> Сохранить в JSON
                    </label>
                    <label>
                        <input type="radio" name="save_destination" value="db"> Сохранить в базу данных
                    </label>
                </div>
                
                <div class="form-row">
                    <label for="album-image" class="file-label">Фото</label>
                    <input type="file" id="album-image" name="image" accept="image/*" hidden>
                    <span class="file-name" id="file-name">Файл не выбран</span>
                </div>

                <div class="form-row">
                    <input type="text" id="album-name" name="name"
                           class="input" placeholder="Название альбома" maxlength="120">
                </div>

                <div class="form-row">
                    <input type="text" id="album-authors" name="authors"
                           class="input" placeholder="Автор (разделитель ;)">
                </div>

                <div class="form-row">
                    <input type="text" id="album-length" name="length"
                           class="input" placeholder="Время (0:12:34)">
                </div>

                <div>
                    <input type="text" id="album-price" name="price" class="input" placeholder="Стоимость $">
                </div>

                <div class="form-row form-row--track">
                    <input type="text" id="track-input"
                           class="input" placeholder="Название трека">
                    <button type="button" id="add-track-btn" class="btn btn--icon" title="Добавить">+</button>
                </div>

                <div class="track-list-edit" id="track-list-edit"></div>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p>Учебный проект</p>
    </footer>

    <script src="{% static 'spotylist/js/main.js' %}"></script>
</body>
</html>
